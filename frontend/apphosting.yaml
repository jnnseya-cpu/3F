# Firebase App Hosting — runtime & build configuration for the Next.js app.
# App root: this "frontend/" directory. In the Firebase console, set the
# App Hosting backend's Root directory to "/frontend".
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0        # scale to zero when idle (cost control pre-launch)
  maxInstances: 10       # raise for launch-day traffic
  concurrency: 80        # requests per instance
  cpu: 1
  memoryMiB: 512

# Environment variables.
#  - Public (NEXT_PUBLIC_*) are safe as plain values, available at BUILD so
#    they are inlined into the client bundle.
#  - Everything sensitive MUST come from Cloud Secret Manager via `secret:`.
#    Create each secret first, then grant App Hosting access, e.g.:
#      firebase apphosting:secrets:set FIREBASE_PRIVATE_KEY
#      firebase apphosting:secrets:grantaccess FIREBASE_PRIVATE_KEY --backend <id>
#    Uncomment a secret line only AFTER the secret exists, or the rollout fails.
env:
  - variable: NEXT_PUBLIC_APP_NAME
    value: "Le Congo D'Abord"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://congodabord.cd"
    availability: [BUILD, RUNTIME]

